name: Build Android APK

on:
  push:
    branches: [ "main", "Dev", "dev" ]
  pull_request:
    branches: [ "main", "Dev", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Fixed Key
        run: |
          keytool -genkey -v -keystore fixed_release.keystore \
            -alias orderflow_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass Orderflow123 \
            -keypass Orderflow123 \
            -dname "CN=Orderflow, OU=Trading, O=Journal, L=City, S=State, C=IN"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Sign APK with Fixed V2/V3 Scheme Key
        run: |
          ANDROID_SDK_ROOT=$ANDROID_HOME
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks fixed_release.keystore \
            --ks-pass pass:Orderflow123 \
            --ks-key-alias orderflow_key \
            --key-pass pass:Orderflow123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out app/build/outputs/apk/debug/app-debug-signed.apk \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ORDERFLOW-DEV-APK
          path: app/build/outputs/apk/debug/app-debug-signed.apk
