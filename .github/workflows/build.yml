name: Android CI Build

on:
  push:
    branches: [ "Dev", "main" ]
  pull_request:
    branches: [ "Dev", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Restore Permanent Keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        mkdir -p ~/.android

        echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ~/orderflow-release.keystore

        rm -f ~/.android/debug.keystore

        keytool -importkeystore \
          -srckeystore ~/orderflow-release.keystore \
          -srcstoretype JKS \
          -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
          -srcalias "$ANDROID_KEY_ALIAS" \
          -srckeypass "$ANDROID_KEY_PASSWORD" \
          -destkeystore ~/.android/debug.keystore \
          -deststoretype JKS \
          -deststorepass android \
          -destalias androiddebugkey \
          -destkeypass android

    - name: Verify Signing Certificate
      run: |
        echo "========================================"
        echo "ORDERFLOW JOURNAL SIGNING CERTIFICATE"
        echo "========================================"

        keytool -list -v \
          -keystore ~/.android/debug.keystore \
          -alias androiddebugkey \
          -storepass android | grep -E "Alias name:|SHA1:|SHA256:"

        echo "========================================"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrderflowJournal-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
